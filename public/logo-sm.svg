  <!-- Shield shape -->
  <path d="M20 3 L36 9 L36 20 Q36 31 20 37 Q4 31 4 20 L4 9 Z" fill="url(#g)"/>
  <path d="M20 4.5 L34.5 10 L34.5 19.5 Q34.5 29.5 20 35.5 Q5.5 29.5 5.5 19.5 L5.5 10 Z" fill="url(#bg)"/>
