  <text x="7" y="24" font-family="Arial Black,Impact,sans-serif" font-size="9.5" font-weight="900" fill="url(#sg)">8</text>
  <text x="14" y="24" font-family="Arial Black,Impact,sans-serif" font-size="9.5" font-weight="900" fill="url(#g)">BIT</text>
